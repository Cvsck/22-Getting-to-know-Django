<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container-fluid">
        <!-- 🔹 Боковое меню -->
        <nav class="sidebar">
            <div>
                <div class="sidebar-header">
                    <div class="logo">B</div>
                    <h4>Меню</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="{% url 'catalog:home' %}">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'catalog:catalog' %}">Категории</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'catalog:orders' %}">Заказы</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'catalog:contacts' %}">Контакты</a></li>
                </ul>
            </div>

            <!-- 🔹 Профиль и Выход -->
            <div class="profile-section">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="{% url 'catalog:profile' %}">Профиль</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'catalog:logout' %}">Выход</a></li>
                </ul>

                <!-- 🔹 Кнопка "Пользователь" с выпадающим списком -->
                <div class="dropdown">
                    <button class="dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="user-btn-content">
                            <img src="{% static 'icons/user.svg' %}" alt="Пользователь" class="user-icon">
                            <span class="user-text">Пользователь</span>
                        </div>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="{% url 'catalog:settings' %}">Настройки</a></li>
                        <li><a class="dropdown-item" href="{% url 'catalog:help' %}">Помощь</a></li>
                        <li class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="{% url 'catalog:logout' %}">Выход</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- 🔹 Основной контент -->
        <main class="main-content">
            <h1>Главная</h1>
            <p>Вы находитесь на сайте, предназначенном для продажи товаров.</p>
        </main>
    </div>

    <!-- 🔹 Подключение Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
