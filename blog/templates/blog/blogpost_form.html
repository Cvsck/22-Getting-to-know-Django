{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center text-primary">
        {% if object %}Редактирование статьи{% else %}Создание статьи{% endif %}
    </h1>

    <form method="post" enctype="multipart/form-data" class="shadow-lg p-4 rounded">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'blog:blog_list' %}" class="btn btn-outline-secondary">← Назад к блогу</a>
    </div>
</div>
{% endblock %}
