{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center text-danger">Удаление статьи</h1>
    <p class="text-center">Вы уверены, что хотите удалить "{{ object.title }}"?</p>

    <form method="post" class="text-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
