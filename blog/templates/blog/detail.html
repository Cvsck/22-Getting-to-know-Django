{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center text-primary">{{ object.title }}</h1>

    {% if object.preview_image %}
        <div class="text-center mb-3">
            <img src="{{ object.preview_image.url }}" alt="Preview" class="img-fluid rounded">
        </div>
    {% endif %}

    <p class="text-center">{{ object.content }}</p>
    <p class="text-center"><strong>Просмотров:</strong> {{ object.view_count }}</p>

    {% if user.is_authenticated %}
    <div class="text-center mt-4">
        <a href="{% url 'blog:blog_edit' object.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'blog:blog_delete' object.pk %}" class="btn btn-danger">Удалить</a>
    </div>
    {% endif %}

    <div class="text-center mt-4">
        <a href="{% url 'blog:blog_list' %}" class="btn btn-outline-primary">← Назад к блогу</a>
    </div>
</div>
{% endblock %}
